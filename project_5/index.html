<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password strength checker</title>
</head>
<body style="margin: 0;height: 100vh;display: flex;justify-content: center;align-items: center;background-color: beige;">
        <form id="form" style="background: white;padding: 30px;border-radius: 10px;box-shadow: 0 0 15px rgba(0,0,0,0.2);text-align:left;">
            <h2 style="text-align: center;">Ragister Here</h2>
            <label for="name">Name :  </label>
            <input type="text" id="name" name="name" placeholder="e.g. Raj Sisodiya">
            <br><br>
            <label for="phone">Phone Number :</label>
            <input type="tel" id="phone" name="phone" placeholder="e.g. 9411419774"><br><br>
            <label for="usrname">Create Your Username :</label>
            <input type="text" id="usrname" name="usrname" ><br><br>
            <label for="password">Create Your Password :</label>
            <input type="password" id="password" name="password">
            <p id="note" style="font-weight: 10; color:gray ; font-size:small;">Note: Create a strong password.</p>
            <button id="submit" type="submit">Submit</button>
            <button type="reset">Clear</button>
            
        </form>
        <script src="./project_5.js"></script>
</body>
</html>
